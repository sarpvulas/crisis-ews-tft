name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install CPU torch, then the declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/repro.txt -r requirements/data.txt "matplotlib>=3.8" pytest
      - name: Run tests (CPU, no Bloomberg data needed)
        env:
          MPLBACKEND: Agg
          WANDB_MODE: offline
        run: python -m pytest -q
